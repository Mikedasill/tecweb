<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script>
    function show(e) {
      const tr = e.target.closest("tr");
      const data = tr.querySelectorAll(".row-data");
      const name = data[0].textContent;
      const age  = data[1].textContent;
      alert("Name: " + name + "\nAge: " + age);
      send2form(name, age);
    }
    function send2form(name, age) {
      const url = "http://localhost/tecweb/practicas/p10/base/formulario.php";
      const q = `?name=${encodeURIComponent(name)}&age=${encodeURIComponent(age)}`;
      // misma pestaña:
      window.location.href = url + q;
    }
  </script>
</head>
<body>
  <table class="table">
    <thead>
      <tr><th>#</th><th>Name</th><th>Age</th><th>Submit</th></tr>
    </thead>
    <tbody>
      <tr><th>1</th><td class="row-data">Sara</td><td class="row-data">23</td>
        <td><button class="btn btn-light" onclick="show(event)">submit</button></td></tr>
      <tr><th>2</th><td class="row-data">John</td><td class="row-data">30</td>
        <td><button class="btn btn-light" onclick="show(event)">submit</button></td></tr>
      <tr><th>3</th><td class="row-data">Naman</td><td class="row-data">20</td>
        <td><button class="btn btn-light" onclick="show(event)">submit</button></td></tr>
    </tbody>
  </table>
</body>
</html>
